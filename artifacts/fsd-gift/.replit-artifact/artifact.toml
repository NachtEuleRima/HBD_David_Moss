kind = "web"
previewPath = "/"
title = "FSD Coast to Coast Gift"
version = "1.0.0"
id = "artifacts/fsd-gift"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22134

[services.development]
run = "pnpm --filter @workspace/fsd-gift run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fsd-gift", "run", "build" ]
publicDir = "artifacts/fsd-gift/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22134"
BASE_PATH = "/"
